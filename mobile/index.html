<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#064e3b">
<title>Ma Scolarité — Mobile</title>
<style>
:root{--g:#064e3b;--g2:#087f5b;--mint:#e8f5ef;--bg:#f4f8f6;--ink:#17352c;--muted:#63776f;--line:#dce8e2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{border:0;border-radius:12px;padding:12px;background:var(--g2);color:#fff;font-weight:700;min-height:44px;cursor:pointer}button.secondary{background:var(--mint);color:var(--g)}header{position:sticky;top:0;background:var(--g);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;z-index:2}header h1{font-size:1.1rem;margin:0}main{max-width:680px;margin:auto;padding:14px 14px 92px}.hero,.panel,.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.hero{background:linear-gradient(135deg,#fff,#e4f4ec);padding:22px}.hero h2{font-size:1.8rem;line-height:1.12;margin:8px 0}.muted,small{color:var(--muted)}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}.tile{background:#fff;color:var(--ink);border:1px solid var(--line);text-align:left;display:flex;align-items:center;gap:10px;min-height:72px}.tile span{font-size:1.4rem}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat strong{display:block;font-size:1.6rem}.panel h2{font-size:1.15rem;margin:0 0 12px}.field{display:grid;gap:5px;margin:10px 0}.field input,.field select{width:100%;padding:12px;border:1px solid #c9d8d0;border-radius:11px;background:#fff}.list{display:grid;gap:8px}.item{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.item small{display:block}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,minmax(0,1fr));z-index:3}.bottom button{background:transparent;color:var(--muted);font-size:.7rem;padding:6px 2px;min-height:52px}.bottom button.active{background:var(--mint);color:var(--g)}.bottom span{display:block;font-size:1.2rem}.plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.plan{background:#fff;color:var(--ink);border:1px solid var(--line);text-align:left}.plan.selected{background:var(--mint);border:2px solid var(--g2)}.plan strong{display:block}.notice{background:#fff4d8;border-radius:12px;padding:12px;font-size:.9rem}.empty{padding:16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}@media(min-width:560px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.plans{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:350px){main{padding:10px 10px 90px}.hero{padding:16px}.hero h2{font-size:1.55rem}}
</style></head>
<body>
<header><h1>🎓 Ma Scolarité</h1><select id="language" aria-label="Langue"><option value="fr">Français</option><option value="en">English</option><option value="ar">العربية</option></select></header>
<main id="app"></main>
<nav class="bottom" aria-label="Navigation principale"><button data-page="home" class="active"><span>⌂</span>Accueil</button><button data-page="students"><span>♙</span>Élèves</button><button data-page="subjects"><span>▤</span>Matières</button><button data-page="schedule"><span>◷</span>Horaires</button><button data-page="menu"><span>☰</span>Menu</button></nav>
<script>
(()=>{const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const KEY='ma-scolarite-mobile-demo';let data={students:[],subjects:[],teachers:[],schedule:[],school:{name:'',total:''},months:1,payment:'Orange Money'},page='home';try{data={...data,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{}const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const nav=[['students','♙','Élèves'],['subjects','▤','Matières'],['schedule','◷','Emploi du temps'],['school','▦','Mon école'],['teachers','♧','Professeurs'],['messages','✉','Messagerie'],['profile','◎','Mon profil'],['subscription','▣','Abonnement'],['admin','⚙','Administration'],['notifications','♢','Notifications']];const tiles=()=>'<div class="tiles">'+nav.map(([p,i,n])=>'<button class="tile" data-page="'+p+'"><span>'+i+'</span><b>'+n+'</b></button>').join('')+'</div>';const field=(label,id,type='text',required=false)=>'<div class="field"><label for="'+id+'">'+label+'</label><input id="'+id+'" type="'+type+'" '+(required?'required':'')+'></div>';const list=(arr,key)=>arr.length?'<div class="list">'+arr.map((x,i)=>'<div class="item"><div><b>'+esc(x.name||x.day||x.text)+'</b><small>'+esc(x.detail||'')+'</small></div><button class="secondary" data-remove="'+key+'" data-index="'+i+'">Retirer</button></div>').join('')+'</div>':'<div class="empty">Aucun élément enregistré.</div>';function render(){let h='';if(page==='home')h='<section class="hero"><small>UNE ÉCOLE, UNE ORGANISATION CLAIRE</small><h2>Chaque journée, bien organisée.</h2><p class="muted">Une plateforme pensée d’abord pour les téléphones.</p><button data-page="students">＋ Ajouter un élève</button></section><div class="stats"><div class="stat"><small>Élèves</small><strong>'+data.students.length+'</strong></div><div class="stat"><small>Matières</small><strong>'+data.subjects.length+'</strong></div></div>'+tiles()+'<p class="notice">Prototype mobile. Les données sont stockées dans ce navigateur uniquement ; une base de données sécurisée est nécessaire pour synchroniser plusieurs comptes.</p>';else if(page==='menu')h='<section class="panel"><h2>Toutes les pages</h2>'+tiles()+'</section>';else if(page==='students')h='<section class="panel"><h2>Inscrire un élève</h2><form data-form="student">'+field('Nom complet','name','text',true)+'<div class="field"><label for="class">Classe</label><select id="class"><option>9e année</option><option>10e année</option><option>11e année</option><option>Terminale</option></select></div>'+field('Téléphone','phone','tel')+'<button>Enregistrer l’élève</button></form></section><section class="panel"><h2>Liste des élèves</h2>'+list(data.students,'students')+'</section>';else if(page==='subjects')h='<section class="panel"><h2>Ajouter une matière</h2><form data-form="subject">'+field('Nom de la matière','name','text',true)+'<button>Enregistrer</button></form></section><section class="panel"><h2>Matières</h2>'+list(data.subjects,'subjects')+'</section>';else if(page==='schedule')h='<section class="panel"><h2>Ajouter un horaire</h2><form data-form="schedule">'+field('Jour','day','text',true)+field('Heure','time','text',true)+field('Matière','subject')+'<button>Enregistrer</button></form></section><section class="panel"><h2>Emploi du temps</h2>'+list(data.schedule,'schedule')+'</section>';else if(page==='subscription')h='<section class="panel"><h2>Abonnement</h2><p>500 FCFA par mois</p><div class="plans">'+[1,2,3,4,5,6].map(n=>'<button class="plan '+(data.months===n?'selected':'')+'" data-months="'+n+'">'+n+' mois<strong>'+(n*500)+' FCFA</strong></button>').join('')+'</div><div class="field"><label for="payment">Moyen de paiement</label><select id="payment"><option>Orange Money</option><option>Carte marchand</option><option>1 Euro</option><option>1 Dollar</option></select></div><p><b>Total : '+data.months*500+' FCFA</b></p><button id="pay">Continuer</button><p class="notice">Le paiement réel n’est pas connecté. Ne marquez aucun abonnement comme payé sans confirmation du prestataire.</p></section>';else if(page==='school')h='<section class="panel"><h2>Mon école</h2><form data-form="school">'+field('Nom de l’école','name','text',true)+field('Effectif total','total','number')+'<button>Enregistrer</button></form></section>';else if(page==='teachers')h='<section class="panel"><h2>Professeurs</h2><p class="muted">La gestion complète des professeurs reste à relier au système principal.</p></section>';else if(page==='messages')h='<section class="panel"><h2>Messagerie</h2><p class="muted">La messagerie partagée nécessite une base de données et des comptes sécurisés.</p></section>';else if(page==='profile')h='<section class="panel"><h2>Mon profil</h2><p class="muted">La connexion sécurisée doit être configurée pour gérer les profils.</p></section>';else if(page==='admin')h='<section class="panel"><h2>Administration</h2><p>Élèves : '+data.students.length+'</p><p>Matières : '+data.subjects.length+'</p><p class="notice">Les rôles administrateur doivent être protégés par une authentification serveur.</p></section>';else h='<section class="panel"><h2>Notifications</h2><p class="muted">Aucune notification.</p></section>';$('#app').innerHTML=h;document.querySelectorAll('.bottom [data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.documentElement.dir=$('#language').value==='ar'?'rtl':'ltr';document.documentElement.lang=$('#language').value}function go(p){page=p;render();scrollTo(0,0)}document.addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b){go(b.dataset.page);return}b=e.target.closest('[data-months]');if(b){data.months=+b.dataset.months;save();render();return}b=e.target.closest('[data-remove]');if(b&&confirm('Retirer cet élément ?')){data[b.dataset.remove].splice(+b.dataset.index,1);save();render();return}if(e.target.id==='pay'){data.payment=$('#payment').value;save();alert('Paiement non connecté : aucune somme n’a été débitée.');}});document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();const v=id=>$('#'+id)?.value.trim()||'';if(f.dataset.form==='student')data.students.push({name:v('name'),detail:v('class')+' · '+v('phone')});if(f.dataset.form==='subject')data.subjects.push({name:v('name')});if(f.dataset.form==='schedule')data.schedule.push({name:v('day')+' · '+v('time'),detail:v('subject')});if(f.dataset.form==='school')data.school={name:v('name'),total:v('total')};save();render()});$('#language').addEventListener('change',render);render()})();
</script></body></html>
